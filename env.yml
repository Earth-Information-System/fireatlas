name: fire_env
channels:
  - conda-forge
  - nodefaults # need to explicitly avoid Anaconda default channel

dependencies:
  - python=3.13
  # Packages with compiled deps 
  - fiona
  - geopandas
  - numpy 
  - pandas 
  - pyarrow
  - pyogrio 
  - pyproj 
  - scikit-learn
  - scipy
  - shapely
  - rasterio 
  - rtree 
  - xarray
  # Only needed for MAAP runtime
  - awscli
  - pip

  - pip: 
      - -e .[prod] 