name: fire_env
channels:
  - conda-forge

dependencies:
  - python=3.13
  # Packages with compiled deps 
  - geopandas<1 
  - numpy 
  - pandas<3 
  - pyarrow
  - pyogrio 
  - pyproj 
  - scikit-learn
  - scipy
  - shapely
  - rasterio 
  - rtree 
  - xarray
  # Only needed for MAAP runtime
  - awscli
  - pip

  - pip: 
      - -e .[prod] 