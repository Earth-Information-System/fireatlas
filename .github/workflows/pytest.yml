name: pytest

on:
  workflow_dispatch:
  push:
    branches: [ "conus-dps", "staging" ]
  pull_request:
    branches: [ "conus-dps", "staging" ]

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Build from the pinned lock so CI tests the exact environment DPS deploys.
    # env.lock.yml is linux-64 and pins python + all runtime dependencies
    - name: Create conda environment from lock
      uses: conda-incubator/setup-miniconda@v3
      with:
        init-shell: bash
        environment-file: env.lock.yml
        cache-environment: true
        activate-environment: fire_env
        post-cleanup: 'all'
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: us-east-1
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
    # The lockfile omits fireatlas itself and test deps (lock was generated with .[prod]).
    - name: Install fireatlas
      run: pip install -e '.[test]'
      shell: bash -el {0}
    - name: Run all tests with pytest
      run: pytest -v --runslow tests/
      shell: bash -el {0}
