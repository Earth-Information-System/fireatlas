# .github/actions/latency_logging/action.yml
name: "Alert on Long Data Latency"
description: "Checks ~ four hours after data should be generated an sends an alert if data is not current."
inputs:
  maap_pgt_secret:
    description: "MAAP_PGT"
    required: true
  email_pw_secret:
    description: "email pw"
    required: true
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        docker run \
          --env MAAP_PGT=${{ inputs.maap_pgt_secret }} \
          --env MAAP_CONF=/maap-py \
          --env EMAIL_PW=${{ inputs.email_pw_secret }} \
          --pull=always -u ${UID}:${DOCKER_GID} -v ${PWD}:${PWD} -w ${PWD} \
          --rm mas.maap-project.org/root/maap-workspaces/base_images/python:v4.3.0 \
          /opt/conda/envs/python/bin/python maap_runtime/latency_logging.py
